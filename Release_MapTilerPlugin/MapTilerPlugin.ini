; =====================================================================
; CMOMapTilerPlugin 設定檔 (Configuration File)
; 適用於 Command: Modern Operations (CMO)
; =====================================================================

[MapTiler]
; 是否啟用外掛攔截 Bing Maps 衛星圖層 (true / false)
Enabled=true

; 您的 MapTiler API Key
; 請至 https://cloud.maptiler.com/account/keys/ 免費註冊並取得您的專屬 API Key
ApiKey=YOUR_MAPTILER_API_KEY_HERE

; 圖磚下載 URL 模板 (URL Template):
; 可用變數:
;   {z}        - 縮放層級 (Zoom Level: 1 ~ 18)
;   {x}        - 墨卡托 X 座標 (Tile Column)
;   {y}        - 墨卡托 Y 座標 (Tile Row, 北為 0)
;   {key}      - 上方的 ApiKey
;   {quadkey}  - Bing 原始網格字串
;
; 選項 1: MapTiler 衛星混合圖層 (512x512 高解析度 - 推薦，銳利度極佳):
UrlTemplate=https://api.maptiler.com/maps/hybrid/{z}/{x}/{y}.jpg?key={key}
;
; 選項 2: MapTiler 衛星混合圖層 (256x256 標準解析度):
; UrlTemplate=https://api.maptiler.com/maps/hybrid/256/{z}/{x}/{y}.jpg?key={key}
;
; 選項 3: 自訂第三方程式碼或 XYZ 圖磚伺服器 (如 Google Hybrid、Esri 等):
; UrlTemplate=https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}

; 是否啟用本機磁碟快取 (強烈建議保持 true，大幅節省 API 流量配額並秒開圖磚)
EnableDiskCache=true

; 快取資料夾名稱/路徑 (相對於遊戲目錄，例如 Cache\MapTilerHybrid)
CacheDirectory=Cache\MapTilerHybrid

; 當 MapTiler 圖磚下載失敗或網路超時時，是否自動回退至原始 Bing Maps 伺服器
FallbackToBingOnError=true

; 網路連線逾時時間 (秒)
TimeoutSeconds=12

; 同時最大連線下載數
MaxConcurrentDownloads=16

[Logging]
; 是否啟用日誌記錄 (寫入遊戲目錄下的 MapTilerPlugin.log)
EnableLogging=true

; 是否輸出每一張圖磚的快取命中與詳細下載紀錄 (除錯時可設為 true，平常設為 false 提升效能)
VerboseLogging=false
